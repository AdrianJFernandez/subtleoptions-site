<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; URL='https://internal.subtleoptions.com'" />
    <meta name="description" content="Neptune corridor — redirected to classified internal subdomain for authorized crews." />
    <title>NEPTUNE // Classified Corridor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="cosmos.css" />
  </head>
  <body data-planet="neptune">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="cosmos-bg" aria-hidden="true"></div>
    <div class="cosmos-vignette" aria-hidden="true"></div>
    <div class="cosmos-scanlines" aria-hidden="true"></div>
    <div class="cosmos-noise" aria-hidden="true"></div>

    <div class="page-shell">
      <a class="skip-link" href="#main">Skip to egress link</a>

      <header class="cosmos-header">
        <div class="hud-panel">
          <div class="hud-titlebar">
            <span>NEPTUNE_AIRLOCK</span>
            <span class="status-pill">ACCESS_DELEGATED</span>
          </div>
        </div>
      </header>

      <main id="main" class="cosmos-main">
        <div class="hud-panel">
          <div class="hud-titlebar">
            <span>HANDOFF_SEQUENCE</span>
            <span class="status-pill">redirect/meta</span>
          </div>
          <div class="hud-body">
            <div class="hero-orbit">
              <div class="planet-badge" aria-hidden="true">
                <span class="planet-visual skin-neptune"></span>
              </div>
              <div class="hero-copy">
                <p class="lede lede-tight">
                  Diverting through Cloudflare Access. If rotation doesn’t kick in instantly,
                  <a href="https://internal.subtleoptions.com">use the wet dock link manually</a>.
                </p>
              </div>
            </div>
            <nav class="subpage-nav" aria-label="Navigation">
              <a href="index.html">◀ Abort to Sol map</a>
            </nav>
          </div>
        </div>
      </main>

      <footer class="cosmos-footer">NEPTUNE · eyes-only transit lane</footer>
    </div>

    <script src="cosmos.js" defer></script>
  </body>
</html>
