<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Send a message through the contact form; submissions are handled via a Cloudflare Worker." />
  <title>Contact Us</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <p>Please fill out the form below to get in touch. (This form is protected by Cloudflare!)</p>
  </header>

  <main>
    <form action="https://contact-form-api.fernandezadrian23.workers.dev" method="POST">
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="subject">Subject:</label>
      <input type="text" id="subject" name="subject" />

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" cols="40" required></textarea>

      <!-- Honeypot field to catch bots -->
      <input type="text" name="hiddenField" style="display:none;" />

      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
